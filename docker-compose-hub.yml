# Use root/example as user/password credentials
version: '3.1'

services:

  mongo:
    image: mongo
    restart: always
    container_name: mongo-simawas-next
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dkpp
    volumes: 
      - database1-1:/mongo1
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 360M

  mongo-express:
    image: mongo-express
    restart: always
    container_name: mongo-express-simawas-next
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: simawasDkpp
      ME_CONFIG_MONGODB_URL: mongodb://root:dkpp@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: simawasDkpp
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 360M

  minio:
    container_name: minio-simawas-next
    image: bitnami/minio:latest
    volumes:
      - data1-1:/minio1
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 360M

  simawas-next:
    container_name: simawas-next
    image: elcoputra/simawas-next_simawas-next:latest
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SILINDA_API: http://svc-silinda.jabarprov.go.id
      GENERATE_SOURCEMAP: 'false'
      BASE_URL: http://localhost:3000
      KEY_REGISTER: inikeyregister
      URL_MONGO: mongodb://root:dkpp@mongo:27017/?authSource=admin&readPreference=primary&appname=simawas&directConnection=true&ssl=false
      DB_MONGO: simawas
      URL_MINIO: urlminio
      USER_MINIO: userMinio
      PASSWORD_MINIO: userMinio
      SALT_PASSWORD: salting
      TOKEN_KEY: tokey
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healt_check"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - "simawas:/app/src"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 360M

volumes:
  data1-1:
  database1-1:
  simawas: